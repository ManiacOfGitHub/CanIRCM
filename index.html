<!DOCTYPE html>
<html lang="en" class="h-100" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can I RCM?</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" crossorigin="anonymous">
</head>
<body class="d-flex flex-column h-100">
    <div class="flex-shrink-0">
        <div class="container">
            <a href="https://github.com/ManiacOfGitHub/CanIRCM" style="position: absolute; top: 0.5em; right: 0.5em"><img src="github-mark-white.svg" style="height:2em;" alt="Repo"></a>
            <h1 class="text-center pt-2">Can I RCM?</h1>
            <hr>
            <noscript>
                <div class="card">
                    <div class="card-body">
                        This tool determines whether your Nintendo Switch is patched using JavaScript entirely within your browser. Please <a href="https://enable-javascript.com/">enable JavaScript</a> to continue.
                    </div>
                </div>
            </noscript>
            <form id="form" style="display: none;" action="javascript:void(0);" class="text-center">
                <label for="serial" class="col-form-label fw-bold">Serial:</label>
                <br>
                <input type="text" class="form-control text-center m-auto w-50" id="serial">
                <br>
                <input type="submit" class="btn btn-primary" id="submit" value="Check">
            </form>
            <div id="output" style="display: none;">
                <hr>
                <div class="alert alert-success" id="outputAlert">
                    Serial <span id="serialOutput"></span> <span id="outputMessage"></span>
                </div>
            </div>
            <div id="modelTable" style="display: none;">
                <hr>
                <div class="row g-2">
                    <div class="col-12 col-lg">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Switch v2 (<i>not</i> a Switch 2)</h5>
                                <div class="card-text">
                                    Note that the kickstand is small.<br>
                                    Model number: HAC-001(-01)
                                </div>
                            </div>
                            <img src="img/v2.jpg" alt="Back of Switch v2 console" class="card-img-bottom">
                        </div>
                    </div>
                    <div class="col-12 col-lg">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Switch OLED</h5>
                                <div class="card-text">
                                    Note that the kickstand extends across the entire back of the console.<br>
                                    Model number: HEG-001
                                </div>
                            </div>
                            <img src="img/oled.jpg" alt="Back of Switch OLED console" class="card-img-bottom" title="Thanks to @bloodthirstyzai on Discord">
                        </div>
                    </div>
                    <div class="col-12 col-lg">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Switch Lite</h5>
                                <div class="card-text">
                                    Note that there are no removable controllers.<br>
                                    Model number: HDH-001
                                </div>
                            </div>
                            <img src="img/lite.jpg" alt="Back of Switch Lite console" class="card-img-bottom">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
